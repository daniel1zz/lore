project:
  name: lore
  author: owner
ai:
  providers:
    claude-cli:
      command: claude
      args: ["-p"]
      timeout_ms: 180000
  assess:
    model: claude-opus-5-5
# Memory-file budgets (spec-project-claude-md-content-contract D1: numbers live
# HERE, never in prose/hooks). Dogfood-tightened below the distribution defaults
# (root 300L/30720B): the shipped defaults are an adoption-safe anti-explosion
# ceiling, not a size recommendation — for our own repo the root file sits at
# ~198L/20.4KB after the 2026-07-27 spec-index retirement, so the ceiling is
# pinned ~10% above that. Growth beyond it must delete before it adds.
context:
  memory_files:
    root:
      max_lines: 220
      max_bytes: 24576
# SPEC-058 verification profiles — per-spec_kind oracle-coverage floors.
# Armed on this corpus 2026-07-21: the mechanism shipped in SPEC-058 but was
# only ever seeded by `lore setup --project`, so this (pre-SPEC-058) corpus
# had no `workflow:` key at all and every floor was a vacuous pass — we built
# the gate and never dogfooded it. An oracle counts as covered iff at least
# one declared AC binds verify.mode=script to that oracle.
workflow:
  # The three commands a task's done contract runs (AC-DCS1-9): written into the contract by `lore approve`.
  done_contract:
    install: "bun install --frozen-lockfile"
    typecheck: "bun run typecheck"
    test_file: "bun run test:file {file}"
  # Main moves only through `lore integrate` (adr-main-advances-only-by-lore-integrate-per-session).
  # The floor runs in the session's fresh integration worktree: install deps, then the code-only floor
  # (check:static minus the corpus-dependent checks, scripts/run-chain.ts CORPUS_DEPENDENT_CHECKS).
  integrate:
    floor_command: "bun install --frozen-lockfile && bun run check:floor"
    # After a landing refreshes the shared checkout, rebuild its dist/lore (the binary ~/.local/bin/lore links to).
    post_refresh_command: "bun run build"
    # The BRANCH binary's `lore migrate schema` (integrate appends --json): run on the floor's corpus snapshot before the floor
    # (install first: the fresh integration worktree has no node_modules of its own), then once on the live corpus after the rebuild.
    migrate_command: "bun install --frozen-lockfile && bun run packages/lore/src/index.ts migrate schema"
  # The main agent dispatches all source changes to implementer agents in this repo
  # (adr-rule-delivery-tiers-gate-hook-skill-and-optimistic); stop-turn-review checks it once per turn.
  turn_end:
    main_session_source_edits: block
    # Files that must change together (AC-ST-7): an assets/ change without the regenerated manifest is a finding.
    co_change:
      - name: assets-manifest
        when: ["assets/**"]
        require: ["packages/lore/src/generated/assets-manifest.ts"]
  verification_profiles:
    design:
      required_oracles:
        - e2e
      required_uat: true
    feature:
      required_oracles:
        - test
    tech:
      required_oracles:
        - test
    # SPEC-080 C2 as-built (2026-07-26): domain-overview is a narrative kind —
    # zero structured ACs is legal (profile-aware floor, gate-predicates
    # acCountMeetsFloor). No required_oracles: no oracle-coverage floor either.
    domain-overview:
      min_acs: 0
  gates:
    # Citation gate (SPEC-157 C4) ARMED 2026-10-09 on all 12 baseline branches after the fast-mode
    # exit passed (knowledge-fast-mode-re-assessment-after-remediation-ac-bls2-13). A NEW or REVISED
    # criterion must cite a live rule; untouched legacy criteria are never refused. Roll back: mode report.
    ac-cite:
      mode: enforce
      armed_branches:
        - baseline-corpus
        - baseline-product-baseline
        - baseline-specification-and-acceptance
        - baseline-review
        - baseline-execution
        - baseline-session
        - baseline-hygiene
        - baseline-autonomy
        - baseline-issue-loop
        - baseline-distribution
        - baseline-sync
        - baseline-context

# SPEC-GD D3 (spec-governance-defaults-must-ship-and-every-recorded-gap-must):
# names WHERE this corpus's own `lore report-issue` reports go. Self-referential
# and legitimate, not circular -- for the lore upstream itself, "where reports
# go" IS this repo's own GitHub intake. Landed 2026-08-11 by
# agent:main-orchestrator because this file is NOT git-tracked (.gitignore:9
# `.lore/*`, excepting only export-index.json and audit-anchor.json), so no
# commit-and-merge path exists and a worktree agent structurally cannot land it.
#
# MIGRATED 2026-08-24 (agent:main-orchestrator) from the retired SQLite shape
# ({corpus_path, root_prd}) to the GitHub intake shape, per
# spec-the-defect-channel-reaches-no-machine-but-its-own-github P4. The old
# shape parsed but was IGNORED, printing a deprecation line on every `lore`
# invocation while `lore report-issue` refused outright (exit 4).
# ⛔ Two things this migration does NOT fix, both recorded in
# knowledge-five-governance-findings-measured-while-closing-the F1:
#   1. The GitHub branch of FeedbackConfigSchema is `.strict()` and accepts ONLY
#      `repo`, so the `root_prd` identity pin (R-5a) has no home in the new
#      shape and is dropped here -- not an oversight.
#   2. The READ path still silently falls back: with a retired-only upstream,
#      `lore issues` and `lore issues --local` were byte-identical (diff exit 0)
#      while the WRITE path refused. The mechanism fix is one shared
#      resolveFeedbackUpstream returning Result, consumed by both verbs.
# `repo` must match the git remote (daniel1zz/lore) but is resolved from HERE,
# never inferred from the remote via `gh -R`.
feedback:
  upstream:
    repo: daniel1zz/lore
