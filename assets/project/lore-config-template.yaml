# Recommended verification-profile block (SPEC-058) — per-spec_kind
# oracle-coverage floors consumed by the `spec-promote` gate's
# `oracleCoverage` predicate and the `plan-promote` gate's `requiresUat`
# predicate (`workflow.gates."spec-promote"` / `workflow.gates."plan-promote"`).
#
# Seeded verbatim into a freshly-scaffolded corpus's `.lore/config.yaml` by
# `lore init` / `lore setup --project` (SPEC-058 §Design Decisions D6) — an
# EXISTING corpus's config.yaml is never touched by this template (opt-in,
# non-breaking, D1: an unconfigured corpus is a vacuous pass, not a failure).
#
# An oracle kind counts as "covered" for a spec_kind's floor iff at least one
# of that spec's declared acceptance criteria binds `verify.mode: script` to
# that oracle (`verify.oracle`) — ai/human-mode criteria never satisfy a floor
# (SPEC-058 §Design Decisions D3: the floor exists precisely to demand
# deterministic verification, not rubric-only judgment).
#
# Customize freely: edit `required_oracles` per spec_kind, delete a spec_kind
# entry to opt it out of the floor, or delete this whole `verification_profiles`
# key to disable the feature for this corpus entirely (an absent/null profile
# resolves to a vacuous pass for every spec_kind).
#
# `min_acs` (task-spec-promote-base-1-ac-rule-is-spec-kind-agnostic-spec-080)
# overrides the `spec-promote` gate's base "≥1 declared acceptance criterion"
# floor per spec_kind — `0` is legal (a narrative kind needs no declared ACs at
# all); omitting `min_acs` keeps the default floor of 1.
workflow:
  verification_profiles:
    design:
      required_oracles:
        - e2e
      # design-kind specs are UI/UX-facing — pairs with the SPEC-054
      # plan-close gate (a plan under a design spec must record a passing
      # UAT verdict before it can archive).
      required_uat: true
    feature:
      required_oracles:
        - test
    tech:
      required_oracles:
        - test
    domain-overview:
      # domain-overview specs are a domain's full narrative (vision, staged
      # commitments, owner-decision context, SPEC-080 C2) — not an
      # implementation contract, so they carry neither an oracle-coverage
      # floor (no `required_oracles` declared at all) nor an acceptance-
      # criteria-count floor.
      min_acs: 0

# Claude CLI provider invocation args — simplified from the registry's
# built-in default (task-raise-capture-timeout-ms-and-max-diff-chars-to-the-values,
# back-catalogue sweep, 2026-08-11). The built-in default statically appends
# "--setting-sources project" to `args`, but `ClaudeCliProvider`'s hermetic
# spawn (`packages/lore/src/ai/hermetic-spawn.ts::buildHermeticSpawnSpec`)
# unconditionally appends its OWN, always-LAST "--setting-sources ''" when the
# command's basename is "claude" — a repeated CLI flag takes its LAST
# occurrence, so the static "--setting-sources project" was already fully
# superseded and functionally inert. This ships the simplified args (dropping
# the dead flag) as the recommended default for every fresh corpus too;
# `command`/`timeout_ms` are unchanged from the built-in and repeated here
# only because a provider entry REPLACES the whole built-in record, never a
# per-field merge. Delete this whole `ai` key to fall back to the built-in.
ai:
  providers:
    claude-cli:
      command: claude
      args: ["-p"]
      timeout_ms: 180000
